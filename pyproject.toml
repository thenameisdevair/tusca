[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "tusca"
version = "0.1.0"
description = "Threat Understanding via Smart Contract Analytics"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
]

[project.scripts]
tusca = "tusca.cli:app"

[tool.setuptools.packages.find]
where = ["src"]